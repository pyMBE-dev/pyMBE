name: samples

on:
  schedule:
    - cron:  '20 6 5,20 * *' # biweekly at 06:20 AM UTC+00 (on the 5th and 20th of the month)
  workflow_dispatch: # manual trigger

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  samples:
    runs-on: ubuntu-26.04
    if: ${{ github.event_name == 'schedule' && github.repository == 'pyMBE-dev/pyMBE' || github.event_name != 'schedule' }}
    env:
      FI_PROVIDER: "^psm3,psm3;ofi_rxd"
      OMPI_MCA_mtl_ofi_provider_exclude: psm3
    strategy:
      matrix:
        software:
          - label: "ESPResSo 5.0.1"
            eessi_modules: ESPResSo/5.0.1-foss-2025a
            eessi_stack_version: "2025.06"
            upload_artifact: true
          - label: "ESPResSo 5.1-dev"
            eessi_modules: ESPResSo/cd7547c43b2dae8e96487bf149d049d701dddd43-foss-2025a
            eessi_stack_version: "2025.06"
            upload_artifact: false
    name: ubuntu - ${{ matrix.software.label }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@main
      - name: Setup EESSI
        uses: eessi/github-action-eessi@v3
        with:
          eessi_stack_version: ${{ matrix.software.eessi_stack_version }}
          use_eessi_module: false
      - name: Install dependencies
        uses: ./.github/actions/dependencies
        with:
          modules: |-
            ${{ matrix.software.eessi_modules }}
      - name: Run testsuite
        run: |
          export NUM_PROC=$(nproc)
          export OMP_PROC_BIND=false OMP_NUM_THREADS=1
          module restore pymbe
          source venv/bin/activate
          make functional_tests -j${NUM_PROC}
        shell: bash
